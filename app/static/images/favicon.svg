<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="auraGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Obsidian Hexagon / Squircle -->
  <rect width="128" height="128" rx="28" fill="#07090e" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  
  <!-- Ambient Inner Glow Ring -->
  <circle cx="64" cy="64" r="50" fill="none" stroke="url(#auraGradient)" stroke-width="2" opacity="0.4" filter="url(#glow)"/>
  
  <!-- Haute Couture Monogram "A" with Diamond Apex -->
  <path d="M64 24 L96 98 H80 L73 80 H55 L48 98 H32 Z M64 48 L58 70 H70 Z" fill="url(#auraGradient)" />
  
  <!-- Sparkling Luxury Diamond at Apex -->
  <polygon points="64,16 68,24 64,32 60,24" fill="url(#goldGradient)" filter="url(#glow)"/>
</svg>
