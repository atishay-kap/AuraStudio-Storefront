<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Payment — AURA STUDIO</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=3.4">
    <script defer src="{{ url_for('static', filename='js/main.js') }}?v=3.4"></script>
</head>
<body class="auth-page-body">
    <!-- Top Minimalist Header -->
    <header class="site-header auth-site-header">
        <div class="nav-container">
            <div class="nav-col-left">
                <a href="{{ url_for('storefront.view_cart') }}" class="nav-link-editorial">&larr; Return to Bag</a>
            </div>
            <div class="nav-col-center">
                <a href="{{ url_for('storefront.index') }}" class="logo-minimal">
                    <span class="logo-brand">AURA STUDIO</span>
                    <span class="logo-sub">IBIZA &bull; MILANO</span>
                </a>
            </div>
            <div class="nav-col-right">
                <span style="font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-secondary);">Encrypted Checkout</span>
            </div>
        </div>
    </header>

    <main class="unified-auth-wrapper">
        <div class="unified-auth-card" style="max-width: 440px;">
            <div class="auth-card-head" style="margin-bottom: 20px;">
                <h1 class="auth-title">Complete Payment</h1>
            </div>

            <div style="background: var(--lux-surface-soft); border: 1px solid var(--lux-border); border-radius: var(--radius-sm); padding: 18px 20px; margin-bottom: 22px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 0.85rem; color: var(--text-secondary);">
                    <span>Order Reference</span>
                    <strong style="color: var(--lux-noir); font-family: var(--font-sans);">#{{ order.id }}</strong>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 0.85rem; color: var(--text-secondary);">
                    <span>Recipient</span>
                    <span style="color: var(--lux-noir); font-weight: 500;">{{ order.customer_name }}</span>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: baseline; padding-top: 10px; border-top: 1px solid var(--lux-border);">
                    <span style="font-size: 0.9rem; font-weight: 600; color: var(--lux-noir);">Total Amount Due</span>
                    <span style="font-size: 1.4rem; font-weight: 700; color: var(--lux-noir); font-family: var(--font-sans);">₹{{ "{:,.2f}".format(order.total_amount) }}</span>
                </div>
            </div>

            <div style="display: flex; flex-direction: column; gap: 12px;">
                <button id="pay-btn" class="btn-primary btn-block" style="padding: 14px 20px; font-size: 0.82rem;">
                    Pay ₹{{ "{:,.2f}".format(order.total_amount) }} Now &rarr;
                </button>

                {% if razorpay_order_id.startswith('mock_order_') %}
                    <form method="POST" action="{{ url_for('storefront.verify_payment') }}" style="margin-top: 4px;">
                        <input type="hidden" name="razorpay_order_id" value="{{ razorpay_order_id }}">
                        <input type="hidden" name="razorpay_payment_id" value="mock_pay_{{ order.id }}">
                        <input type="hidden" name="razorpay_signature" value="mock_sig">
                        <button type="submit" class="btn-secondary btn-block" style="padding: 12px 18px; font-size: 0.78rem;">
                            Simulate Instant Payment Success &rarr;
                        </button>
                    </form>
                {% endif %}
            </div>

            <div class="auth-footer-links" style="margin-top: 18px;">
                <a href="{{ url_for('storefront.view_cart') }}" style="color: var(--text-secondary);">&larr; Return to Shopping Bag</a>
            </div>
        </div>
    </main>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
        const isMock = "{{ razorpay_order_id }}".startsWith("mock_order_");

        if (!isMock) {
            const options = {
                key: "{{ razorpay_key_id }}",
                amount: "{{ amount_paise }}",
                currency: "INR",
                name: "AURA STUDIO",
                description: "Runway Order #{{ order.id }}",
                order_id: "{{ razorpay_order_id }}",
                handler: function (response) {
                    const form = document.createElement("form");
                    form.method = "POST";
                    form.action = "{{ url_for('storefront.verify_payment') }}";

                    const fields = {
                        razorpay_order_id: response.razorpay_order_id,
                        razorpay_payment_id: response.razorpay_payment_id,
                        razorpay_signature: response.razorpay_signature
                    };
                    for (const key in fields) {
                        const input = document.createElement("input");
                        input.type = "hidden";
                        input.name = key;
                        input.value = fields[key];
                        form.appendChild(input);
                    }
                    document.body.appendChild(form);
                    form.submit();
                },
                prefill: {
                    name: "{{ order.customer_name }}",
                    email: "{{ order.customer_email }}"
                },
                theme: {
                    color: "#121110"
                }
            };

            try {
                const rzp = new Razorpay(options);
                rzp.open();

                document.getElementById("pay-btn").onclick = function () {
                    rzp.open();
                };
            } catch (err) {
                console.warn("Razorpay script not ready or network issue:", err);
            }
        }
    </script>
</body>
</html>
